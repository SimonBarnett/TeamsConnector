services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: teamsjoin
      POSTGRES_PASSWORD: teamsjoin
      POSTGRES_DB: teams_audio_join
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamsjoin -d teams_audio_join"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
