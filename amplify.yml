version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22
            - nvm use 22
            - pwd
            - NPM_CONFIG_PRODUCTION=false npm ci --prefix ../.. --include=dev
            - node scripts/write-amplify-env.mjs
        build:
          commands:
            - pwd
            - npm run build --prefix ../.. -w @teams-audio-join/web
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - ../../node_modules/**/*
          - .next/cache/**/*
