version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22
            - nvm use 22
            - pwd
            - if [ -f package-lock.json ]; then npm ci; elif [ -f ../../package-lock.json ]; then cd ../.. && npm ci; else echo "package-lock.json not found"; ls -la; exit 1; fi
        build:
          commands:
            - if [ -f package-lock.json ]; then npm run build -w @teams-audio-join/web; elif [ -f ../../package-lock.json ]; then cd ../.. && npm run build -w @teams-audio-join/web; else echo "package-lock.json not found"; ls -la; exit 1; fi
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
